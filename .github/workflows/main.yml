name: Build BroOS ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin xorriso mtools
      - name: Build BroOS
        run: |
          cat > kernel.asm <<'KASM'
          section.multiboot
          align 4
              dd 0x1BADB002
              dd 0
              dd -0x1BADB002
          section.text
          global _start
          _start:
              mov esp, 0x90000
              mov esi, msg
              mov edi, 0xB8000
              mov ah, 0x0E
          print_loop:
              lodsb
              cmp al, 0
              je halt_loop
              stosw
              jmp print_loop
          halt_loop:
              cli
              hlt
              jmp halt_loop
          section.rodata
          msg db "BROS - JACKPOT!!! BroOS by Rituparna yeah yeah yeah!", 0
          KASM

          cat > linker.ld <<'LLD'
          ENTRY(_start)
          SECTIONS {
          . = 1M;
          .text : { *(.multiboot) *(.text) }
          .rodata : { *(.rodata) }
          .bss : { *(.bss) }
          }
          LLD

          cat > grub.cfg <<'GCFG'
          set timeout=0
          set default=0
          menuentry "BroOS" {
            multiboot /boot/kernel.bin
            boot
          }
          GCFG

          nasm -f elf32 kernel.asm -o kernel.o
          ld -m elf_i386 -T linker.ld -o kernel.bin kernel.o
          mkdir -p iso/boot/grub
          mv kernel.bin iso/boot/
          mv grub.cfg iso/boot/grub/
          grub-mkrescue -o BroOS.iso iso
      - uses: actions/upload-artifact@v4
        with:
          name: BroOS-ISO
          path: BroOS.iso
